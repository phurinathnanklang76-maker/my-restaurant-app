  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-slate-50 text-slate-800 font-sans pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- LUCIDE ICONS FALLBACK ---
    const Icons = window.lucide || {};
    const ShoppingBag = Icons.ShoppingBag || (() => <span>🛒</span>);
    const Utensils = Icons.Utensils || (() => <span>🍽️</span>);
    const Clock = Icons.Clock || (() => <span>⏰</span>);
    const CheckCircle2 = Icons.CheckCircle2 || (() => <span>✅</span>);
    const ChevronRight = Icons.ChevronRight || (() => <span>▶</span>);
    const Plus = Icons.Plus || (() => <span>+</span>);
    const Minus = Icons.Minus || (() => <span>-</span>);
    const Trash2 = Icons.Trash2 || (() => <span>🗑️</span>);
    const LogIn = Icons.LogIn || (() => <span>🔑</span>);
    const UserPlus = Icons.UserPlus || (() => <span>👤</span>);
    const LogOut = Icons.LogOut || (() => <span>🚪</span>);
    const Lock = Icons.Lock || (() => <span>🔒</span>);
    const Mail = Icons.Mail || (() => <span>✉️</span>);
    const Store = Icons.Store || (() => <span>🏪</span>);
    const QrCode = Icons.QrCode || (() => <span>📱</span>);
    const CreditCard = Icons.CreditCard || (() => <span>💳</span>);
    const ChefHat = Icons.ChefHat || (() => <span>👨‍🍳</span>);
    const LayoutDashboard = Icons.LayoutDashboard || (() => <span>📊</span>);
    const MenuIcon = Icons.Menu || (() => <span>📋</span>);
    const Edit3 = Icons.Edit3 || (() => <span>✏️</span>);
    const ImageIcon = Icons.Image || (() => <span>🖼️</span>);
    const AlertCircle = Icons.AlertCircle || (() => <span>⚠️</span>);
    const RefreshCw = Icons.RefreshCw || (() => <span>🔄</span>);

    // --- INITIAL DATA ---
    const INITIAL_CATEGORIES = ["แฮมเบอร์เกอร์โฮมเมด", "ตอติญาโรล", "เพิ่มพิเศษ", "ของทอดทานเล่น", "พิซซ่าชีสยืดๆ", "สุดคุ้ม"];
    const INITIAL_MENU = [
      { id: 1, name: "เนื้อโคขุนแท้", price: 69, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
      { id: 2, name: "หมูเกรด A", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=500&q=80" },
      { id: 3, name: "ไก่กรอบ", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=500&q=80" },
      { id: 4, name: "เบค่อน", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=500&q=80" },
      { id: 5, name: "ปลา", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1521305916504-4a1121188589?auto=format&fit=crop&w=500&q=80" },
      { id: 6, name: "กุ้ง", price: 49, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=500&q=80" },
      { id: 7, name: "ไข่ดาว (ล้วน)", price: 49, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=500&q=80" },
      { id: 8, name: "ตอติญาโรล เนื้อ", price: 69, category: "ตอติญาโรล", image: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=500&q=80" },
      { id: 9, name: "ตอติญาโรล หมู", price: 69, category: "ตอติญาโรล", image: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=500&q=80" },
      { id: 10, name: "ตอติญาโรล ไก่กรอบ", price: 69, category: "ตอติญาโรล", image: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=500&q=80" },
      { id: 11, name: "เพิ่มเนื้อ", price: 25, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1588168333986-5078d3ae3976?auto=format&fit=crop&w=500&q=80" },
      { id: 12, name: "ชีสแผ่น", price: 10, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?auto=format&fit=crop&w=500&q=80" },
      { id: 13, name: "ดับเบิ้ลชีส", price: 18, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?auto=format&fit=crop&w=500&q=80" },
      { id: 14, name: "เบค่อนพิเศษ", price: 17, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1606851094655-b2593a9af63f?auto=format&fit=crop&w=500&q=80" },
      { id: 15, name: "สัปประรด", price: 15, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1550258987-190a2d41a8ba?auto=format&fit=crop&w=500&q=80" },
      { id: 16, name: "หอมทอดพิเศษ", price: 15, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1639024471283-03518883512d?auto=format&fit=crop&w=500&q=80" },
      { id: 17, name: "ไข่ดาวพิเศษ", price: 10, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=500&q=80" },
      { id: 18, name: "ไก่ไม่มีกระดูก 3 ชิ้น", price: 55, category: "ของทอดทานเล่น", image: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=500&q=80" },
      { id: 19, name: "โดนัทกุ้ง CP 3 ชิ้น", price: 59, category: "ของทอดทานเล่น", image: "https://images.unsplash.com/photo-1541529086526-db283c563270?auto=format&fit=crop&w=500&q=80" },
      { id: 20, name: "ชีสบอล CP 3 ชิ้น", price: 49, category: "ของทอดทานเล่น", image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=500&q=80" },
      { id: 21, name: "หอมทอด 7 ชิ้น", price: 50, category: "ของทอดทานเล่น", image: "https://images.unsplash.com/photo-1639024471283-03518883512d?auto=format&fit=crop&w=500&q=80" },
      { id: 22, name: "นักเก็ตไก่ 7 ชิ้น", price: 59, category: "ของทอดทานเล่น", image: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=500&q=80" },
      { id: 23, name: "เฟรนฟราย", price: 35, category: "ของทอดทานเล่น", image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=500&q=80" },
      { id: 24, name: "พิซซ่า ฮาวาเฮี้ยน", price: 99, category: "พิซซ่าชีสยืดๆ", image: "https://images.unsplash.com/photo-1534308983496-4fabb1a015ee?auto=format&fit=crop&w=500&q=80" },
      { id: 25, name: "พิซซ่า เบค่อน ปูอัด", price: 89, category: "พิซซ่าชีสยืดๆ", image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80" },
      { id: 26, name: "พิซซ่าเซตจัดเต็ม", price: 170, category: "พิซซ่าชีสยืดๆ", image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=500&q=80" },
      { id: 27, name: "เซตสุดคุ้ม (หมู)", price: 109, category: "สุดคุ้ม", image: "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=500&q=80" },
      { id: 28, name: "เซตสุดคุ้ม (เนื้อ +5 บาท)", price: 114, category: "สุดคุ้ม", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" }
    ];

    function App() {
      const [currentView, setCurrentView] = useState('customer');
      const [menuItems, setMenuItems] = useState(INITIAL_MENU);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [orders, setOrders] = useState([
        {
          id: "A001", table: "1",
          items: [{ id: 1, name: "เนื้อโคขุนแท้", price: 69, quantity: 1 }, { id: 23, name: "เฟรนฟราย", price: 35, quantity: 1 }],
          total: 104, status: "COOKING", timestamp: "12:00", note: "ไม่ใส่ผัก"
        }
      ]);
      const [queueCounter, setQueueCounter] = useState(2);
      const [selectedTable, setSelectedTable] = useState('1');
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('ทั้งหมด');
      const [cartOpen, setCartOpen] = useState(false);
      const [orderNote, setOrderNote] = useState('');
      const [myOrderQueue, setMyOrderQueue] = useState(null);

      const [users, setUsers] = useState([{ email: "admin@restaurant.com", password: "password123", name: "เจ้าของร้าน" }]);
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authForm, setAuthForm] = useState({ email: '', password: '', name: '' });
      const [authError, setAuthError] = useState('');

      const [adminTab, setAdminTab] = useState('orders');
      
      // เพิ่ม State สำหรับจัดการฟอร์ม (รองรับทั้งเพิ่มใหม่ และแก้ไข)
      const [editingId, setEditingId] = useState(null);
      const [menuForm, setMenuForm] = useState({ name: '', price: '', category: INITIAL_CATEGORIES[0], image: '' });

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const table = urlParams.get('table');
        if (table) setSelectedTable(table);
      }, []);

      const addToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { ...item, quantity: 1 }];
        });
      };

      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      const placeOrder = () => {
        if (cart.length === 0) return;
        const queueNo = `A${String(queueCounter).padStart(3, '0')}`;
        const newOrder = {
          id: queueNo, table: selectedTable, items: [...cart], total: cartTotal,
          status: "PENDING", timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), note: orderNote
        };
        setOrders(prev => [newOrder, ...prev]);
        setMyOrderQueue(queueNo);
        setQueueCounter(prev => prev + 1);
        setCart([]);
        setOrderNote('');
        setCartOpen(false);
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');
        if (authMode === 'login') {
          const found = users.find(u => u.email === authForm.email && u.password === authForm.password);
          if (found) { setCurrentUser(found); setAuthForm({ email: '', password: '', name: '' }); }
          else { setAuthError('อีเมลหรือรหัสผ่านไม่ถูกต้อง'); }
        } else {
          if (!authForm.email || !authForm.password || !authForm.name) { setAuthError('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
          if (users.some(u => u.email === authForm.email)) { setAuthError('อีเมลนี้ถูกใช้งานในระบบแล้ว'); return; }
          const newUser = { email: authForm.email, password: authForm.password, name: authForm.name };
          setUsers([...users, newUser]); setCurrentUser(newUser); setAuthForm({ email: '', password: '', name: '' });
        }
      };

      const updateOrderStatus = (orderId, nextStatus) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: nextStatus } : o));
      };

      // บันทึกเมนู (แยกเคสระหว่าง เพิ่มใหม่ กับ แก้ไขเมนูเดิม)
      const handleSaveMenu = (e) => {
        e.preventDefault();
        if (!menuForm.name || !menuForm.price) return;

        if (editingId !== null) {
          // โหมดแก้ไขเมนูเดิม
          setMenuItems(prev => prev.map(item => item.id === editingId ? {
            ...item,
            name: menuForm.name,
            price: parseFloat(menuForm.price),
            category: menuForm.category,
            image: menuForm.image || item.image
          } : item));
          setEditingId(null);
        } else {
          // โหมดเพิ่มเมนูใหม่
          const newItem = {
            id: Date.now(),
            name: menuForm.name,
            price: parseFloat(menuForm.price),
            category: menuForm.category,
            image: menuForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80'
          };
          setMenuItems([...menuItems, newItem]);
        }
        // เคลียร์ฟอร์ม
        setMenuForm({ name: '', price: '', category: INITIAL_CATEGORIES[0], image: '' });
      };

      // กดปุ่มแก้ไข ดึงข้อมูลขึ้นมาใส่ฟอร์มด้านบน
      const handleEditClick = (item) => {
        setEditingId(item.id);
        setMenuForm({
          name: item.name,
          price: item.price,
          category: item.category,
          image: item.image
        });
        window.scrollTo({ top: 0, behavior: 'smooth' }); // เลื่อนจอขึ้นไปดูฟอร์ม
      };

      const handleDeleteMenu = (id) => {
        setMenuItems(prev => prev.filter(item => item.id !== id));
      };

      // ฟังก์ชันรีเซ็ตเมนูตั้งต้น (กรณีเผลอลบหายหมด)
      const handleResetMenu = () => {
        if (confirm('คุณต้องการรีเซ็ตเมนูทั้งหมดกลับเป็นค่าเริ่มต้นใช่หรือไม่?')) {
          setMenuItems(INITIAL_MENU);
        }
      };

      const getStatusBadge = (status) => {
        switch (status) {
          case 'PENDING': return <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1"><Clock className="w-3 h-3"/> รอยืนยัน</span>;
          case 'COOKING': return <span className="bg-orange-100 text-orange-800 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1"><ChefHat className="w-3 h-3 animate-bounce"/> กำลังทำอาหาร</span>;
          case 'READY': return <span className="bg-green-100 text-green-800 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1"><CheckCircle2 className="w-3 h-3"/> อาหารเสร็จแล้ว</span>;
          case 'PAID': return <span className="bg-gray-100 text-gray-700 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1"><CreditCard className="w-3 h-3"/> ชำระเงินแล้ว</span>;
          default: return null;
        }
      };

      const myOrder = orders.find(o => o.id === myOrderQueue);

      return (
        <div>
          {/* Top Switcher Bar */}
          <div className="bg-slate-900 text-white px-4 py-2 flex justify-between items-center text-sm sticky top-0 z-50 shadow-md">
            <div className="flex items-center gap-2">
              <Store className="w-4 h-4 text-orange-400" />
              <span className="font-bold">ร้านอร่อยโฮมเมด (QR Food System)</span>
            </div>
            <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
              <button onClick={() => setCurrentView('customer')} className={`px-3 py-1 rounded-md text-xs font-medium ${currentView === 'customer' ? 'bg-orange-500 text-white' : 'text-slate-300'}`}>หน้าลูกค้า</button>
              <button onClick={() => setCurrentView('admin')} className={`px-3 py-1 rounded-md text-xs font-medium ${currentView === 'admin' ? 'bg-orange-500 text-white' : 'text-slate-300'}`}>หลังบ้าน</button>
            </div>
          </div>

          {currentView === 'customer' ? (
            <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-24">
              <div className="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-5 rounded-b-3xl shadow-lg">
                <div className="flex justify-between items-start">
                  <div>
                    <h1 className="text-2xl font-black">อร่อยโฮมเมด</h1>
                    <p className="text-orange-100 text-xs">สแกน สั่ง ทานง่าย รวดเร็ว</p>
                  </div>
                  <div className="bg-white/20 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1">
                    <QrCode className="w-3.5 h-3.5" /> โต๊ะ {selectedTable}
                  </div>
                </div>
              </div>

              {myOrder && (
                <div className="m-4 p-4 bg-orange-50 border-2 border-orange-200 rounded-2xl">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-extrabold text-orange-600">คิวของคุณ #{myOrder.id}</span>
                    {getStatusBadge(myOrder.status)}
                  </div>
                </div>
              )}

              <div className="p-4 overflow-x-auto flex gap-2 border-b">
                <button onClick={() => setSelectedCategory('ทั้งหมด')} className={`px-4 py-2 rounded-full text-xs font-bold ${selectedCategory === 'ทั้งหมด' ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600'}`}>ทั้งหมด</button>
                {categories.map(cat => (
                  <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap ${selectedCategory === cat ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600'}`}>{cat}</button>
                ))}
              </div>

              <div className="p-4 space-y-3">
                {menuItems.filter(i => selectedCategory === 'ทั้งหมด' || i.category === selectedCategory).map(item => (
                  <div key={item.id} className="bg-white border rounded-2xl p-3 flex gap-3 shadow-sm">
                    <img src={item.image} alt={item.name} className="w-20 h-20 object-cover rounded-xl" />
                    <div className="flex-1 flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded-full">{item.category}</span>
                        <h3 className="font-bold text-slate-800 text-sm mt-1">{item.name}</h3>
                      </div>
                      <div className="flex justify-between items-end">
                        <span className="text-base font-black">฿{item.price}</span>
                        <button onClick={() => addToCart(item)} className="bg-orange-500 text-white px-3 py-1 rounded-xl text-xs font-bold flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> สั่ง</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {cart.length > 0 && (
                <div className="fixed bottom-4 left-1/2 -translate-x-1/2 w-full max-w-md px-4 z-40">
                  <button onClick={() => setCartOpen(true)} className="w-full bg-slate-900 text-white p-4 rounded-2xl shadow-xl flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <div className="bg-orange-500 text-white text-xs font-bold w-7 h-7 rounded-full flex items-center justify-center">{cart.reduce((s, i) => s + i.quantity, 0)}</div>
                      <div className="text-left"><p className="text-xs text-slate-400">ดูตะกร้า</p><p className="font-bold text-sm">โต๊ะ {selectedTable}</p></div>
                    </div>
                    <span className="text-lg font-black text-orange-400">฿{cartTotal}</span>
                  </button>
                </div>
              )}

              {cartOpen && (
                <div className="fixed inset-0 bg-black/60 z-50 flex justify-center items-end">
                  <div className="bg-white w-full max-w-md rounded-t-3xl p-6 max-h-[85vh] flex flex-col">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b">
                      <h3 className="font-extrabold text-lg">ตะกร้าสินค้า (โต๊ะ {selectedTable})</h3>
                      <button onClick={() => setCartOpen(false)} className="text-slate-400 font-bold">✕</button>
                    </div>
                    <div className="overflow-y-auto flex-1 space-y-3">
                      {cart.map(item => (
                        <div key={item.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                          <div><h4 className="font-bold text-sm">{item.name}</h4><p className="text-xs text-slate-500">฿{item.price} x {item.quantity}</p></div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQuantity(item.id, -1)} className="w-7 h-7 bg-white border rounded-lg flex items-center justify-center"><Minus className="w-3 h-3" /></button>
                            <span className="font-bold text-sm">{item.quantity}</span>
                            <button onClick={() => updateQuantity(item.id, 1)} className="w-7 h-7 bg-orange-500 text-white rounded-lg flex items-center justify-center"><Plus className="w-3 h-3" /></button>
                          </div>
                        </div>
                      ))}
                      <div>
                        <label className="text-xs font-bold text-slate-600 mb-1 block">หมายเหตุถึงครัว:</label>
                        <textarea value={orderNote} onChange={(e) => setOrderNote(e.target.value)} placeholder="เช่น เผ็ดน้อย..." className="w-full text-xs p-3 border rounded-xl bg-slate-50 h-16" />
                      </div>
                    </div>
                    <div className="pt-4 border-t mt-4">
                      <div className="flex justify-between items-center mb-4"><span className="font-bold">รวมทั้งหมด:</span><span className="text-2xl font-black text-orange-500">฿{cartTotal}</span></div>
                      <button onClick={placeOrder} className="w-full bg-orange-500 text-white py-3 rounded-2xl font-extrabold shadow-lg">ยืนยันการสั่งซื้อ</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="max-w-4xl mx-auto px-4 py-6">
              {!currentUser ? (
                <div className="max-w-md mx-auto bg-white rounded-3xl p-8 shadow-xl border">
                  <h2 className="text-2xl font-black text-center mb-6">เข้าสู่ระบบเจ้าของร้าน</h2>
                  {authError && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-xs">{authError}</div>}
                  <form onSubmit={handleAuthSubmit} className="space-y-4">
                    <div><label className="text-xs font-bold block mb-1">อีเมล</label><input type="email" required value={authForm.email} onChange={(e) => setAuthForm({...authForm, email: e.target.value})} className="w-full p-3 border rounded-xl text-sm" /></div>
                    <div><label className="text-xs font-bold block mb-1">รหัสผ่าน</label><input type="password" required value={authForm.password} onChange={(e) => setAuthForm({...authForm, password: e.target.value})} className="w-full p-3 border rounded-xl text-sm" /></div>
                    <button type="submit" className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">เข้าสู่ระบบ</button>
                  </form>
                  <div className="mt-4 text-center text-xs text-slate-500">Demo: admin@restaurant.com / password123</div>
                </div>
              ) : (
                <div className="bg-white rounded-3xl p-6 shadow-sm border space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h1 className="text-2xl font-black">ยินดีต้อนรับ, {currentUser.name}</h1>
                      <p className="text-xs text-slate-500">{currentUser.email}</p>
                    </div>
                    <button onClick={() => setCurrentUser(null)} className="px-4 py-2 bg-slate-100 text-red-600 rounded-xl text-xs font-bold">ออกจากระบบ</button>
                  </div>

                  {/* Admin Sub-tabs */}
                  <div className="flex gap-2 border-b pb-3">
                    <button onClick={() => setAdminTab('orders')} className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'orders' ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600'}`}>จัดการออเดอร์ ({orders.length})</button>
                    <button onClick={() => setAdminTab('menu')} className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'menu' ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600'}`}>จัดการเมนูอาหาร ({menuItems.length})</button>
                  </div>

                  {adminTab === 'orders' ? (
                    <div className="space-y-4">
                      <h3 className="font-bold text-slate-700">รายการออเดอร์ทั้งหมด</h3>
                      {orders.map(order => (
                        <div key={order.id} className="border p-4 rounded-2xl bg-slate-50 flex flex-col sm:flex-row justify-between gap-4">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="font-extrabold text-lg text-orange-600">คิว #{order.id}</span>
                              <span className="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full font-bold">โต๊ะ {order.table}</span>
                              {getStatusBadge(order.status)}
                            </div>
                            <p className="text-xs text-slate-500 mb-2">เวลา: {order.timestamp} {order.note && `| หมายเหตุ: ${order.note}`}</p>
                            <ul className="text-xs space-y-1">
                              {order.items.map((it, idx) => (
                                <li key={idx}>- {it.name} (x{it.quantity}) ฿{it.price * it.quantity}</li>
                              ))}
                            </ul>
                          </div>
                          <div className="flex flex-col gap-2 justify-center">
                            <span className="text-base font-black text-right">฿{order.total}</span>
                            <div className="flex gap-1">
                              {order.status === 'PENDING' && (
                                <button onClick={() => updateOrderStatus(order.id, 'COOKING')} className="bg-orange-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold">รับทำอาหาร</button>
                              )}
                              {order.status === 'COOKING' && (
                                <button onClick={() => updateOrderStatus(order.id, 'READY')} className="bg-green-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold">ทำเสร็จแล้ว</button>
                              )}
                              {order.status === 'READY' && (
                                <button onClick={() => updateOrderStatus(order.id, 'PAID')} className="bg-slate-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold">ชำระเงินแล้ว</button>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="space-y-6">
                      {/* ฟอร์มเพิ่ม / แก้ไขเมนูอาหาร */}
                      <form onSubmit={handleSaveMenu} className={`p-4 rounded-2xl border space-y-3 transition-colors ${editingId ? 'bg-amber-50 border-amber-300' : 'bg-slate-50'}`}>
                        <div className="flex justify-between items-center">
                          <h3 className="font-bold text-slate-700 text-sm">
                            {editingId ? '✏️ แก้ไขข้อมูลเมนูอาหาร' : '➕ เพิ่มเมนูอาหารใหม่'}
                          </h3>
                          {editingId && (
                            <button 
                              type="button" 
                              onClick={() => { setEditingId(null); setMenuForm({ name: '', price: '', category: INITIAL_CATEGORIES[0], image: '' }); }}
                              className="text-xs text-red-500 font-bold hover:underline"
                            >
                              ยกเลิกการแก้ไข
                            </button>
                          )}
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <input type="text" placeholder="ชื่อเมนู" value={menuForm.name} onChange={e => setMenuForm({...menuForm, name: e.target.value})} className="p-2.5 border rounded-xl text-xs bg-white" required />
                          <input type="number" placeholder="ราคา (บาท)" value={menuForm.price} onChange={e => setMenuForm({...menuForm, price: e.target.value})} className="p-2.5 border rounded-xl text-xs bg-white" required />
                          <select value={menuForm.category} onChange={e => setMenuForm({...menuForm, category: e.target.value})} className="p-2.5 border rounded-xl text-xs bg-white">
                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                          <input type="text" placeholder="URL รูปภาพ (ถ้ามี)" value={menuForm.image} onChange={e => setMenuForm({...menuForm, image: e.target.value})} className="p-2.5 border rounded-xl text-xs bg-white" />
                        </div>
                        <button type="submit" className={`px-4 py-2 rounded-xl text-xs font-bold text-white ${editingId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-orange-500 hover:bg-orange-600'}`}>
                          {editingId ? 'บันทึกการแก้ไข' : 'บันทึกเมนูใหม่'}
                        </button>
                      </form>

                      {/* ปุ่มรีเซ็ตเมนูเริ่มต้น และรายชื่อเมนู */}
                      <div className="flex justify-between items-center pt-2">
                        <h3 className="font-bold text-slate-700 text-sm">รายการเมนูทั้งหมดในระบบ</h3>
                        <button 
                          onClick={handleResetMenu}
                          className="flex items-center gap-1 text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-bold transition-all"
                        >
                          <RefreshCw className="w-3.5 h-3.5" /> รีเซ็ตเมนูตั้งต้น
                        </button>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {menuItems.map(item => (
                          <div key={item.id} className="border p-3 rounded-xl flex justify-between items-center bg-white shadow-sm">
                            <div className="flex items-center gap-3">
                              <img src={item.image} alt={item.name} className="w-12 h-12 object-cover rounded-lg bg-slate-100" />
                              <div>
                                <span className="text-[9px] font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded-full">{item.category}</span>
                                <h4 className="font-bold text-xs mt-0.5">{item.name}</h4>
                                <p className="text-xs text-orange-600 font-bold">฿{item.price}</p>
                              </div>
                            </div>
                            <div className="flex items-center gap-1">
                              <button onClick={() => handleEditClick(item)} className="text-blue-500 hover:bg-blue-50 p-2 rounded-lg transition-colors" title="แก้ไข">
                                <Edit3 className="w-4 h-4" />
                              </button>
                              <button onClick={() => handleDeleteMenu(item.id)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors" title="ลบ">
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
