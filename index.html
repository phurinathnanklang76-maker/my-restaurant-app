<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสั่งอาหารร้านค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    // Lucide Icons fallback
    const Icons = window.lucide || {};
    const ShoppingBag = Icons.ShoppingBag || (() => <span>🛒</span>);
    const Utensils = Icons.Utensils || (() => <span>🍽️</span>);
    const Clock = Icons.Clock || (() => <span>⏰</span>);
    const CheckCircle2 = Icons.CheckCircle2 || (() => <span>✅</span>);
    const ChevronRight = Icons.ChevronRight || (() => <span>▶</span>);
    const Plus = Icons.Plus || (() => <span>+</span>);
    const Minus = Icons.Minus || (() => <span>-</span>);
    const Trash2 = Icons.Trash2 || (() => <span>🗑️</span>);
    const LogIn = Icons.LogIn || (() => <span>🔑</span>);
    const UserPlus = Icons.UserPlus || (() => <span>👤</span>);
    const LogOut = Icons.LogOut || (() => <span>🚪</span>);
    const Lock = Icons.Lock || (() => <span>🔒</span>);
    const Mail = Icons.Mail || (() => <span>✉️</span>);
    const Store = Icons.Store || (() => <span>🏪</span>);
    const QrCode = Icons.QrCode || (() => <span>📱</span>);
    const CreditCard = Icons.CreditCard || (() => <span>💳</span>);
    const ChefHat = Icons.ChefHat || (() => <span>👨‍🍳</span>);
    const LayoutDashboard = Icons.LayoutDashboard || (() => <span>📊</span>);
    const MenuIcon = Icons.Menu || (() => <span>📋</span>);
    const Edit3 = Icons.Edit3 || (() => <span>✏️</span>);
    const ImageIcon = Icons.Image || (() => <span>🖼️</span>);
    const AlertCircle = Icons.AlertCircle || (() => <span>⚠️</span>);
    const RefreshCw = Icons.RefreshCw || (() => <span>🔄</span>);

    // --- INITIAL MENU DATA ---
    const INITIAL_CATEGORIES = [ "แฮมเบอร์เกอร์โฮมเมด", "ตอติญาโรล", "เพิ่มพิเศษ", "ของทอดทานเล่น", "พิซซ่าชีสยืดๆ", "สุดคุ้ม" ]; 
    const INITIAL_MENU = [ 
      { id: 1, name: "เนื้อโคขุนแท้", price: 69, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" }, 
      { id: 2, name: "หมูเกรด A", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=500&q=80" }, 
      { id: 3, name: "ไก่กรอบ", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=500&q=80" }, 
      { id: 4, name: "เบคอน", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=500&q=80" }, 
      { id: 5, name: "ปลา", price: 59, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1521305916504-4a1121188589?auto=format&fit=crop&w=500&q=80" }, 
      { id: 6, name: "กุ้ง", price: 49, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=500&q=80" }, 
      { id: 7, name: "ไข่ดาว (ล้วน)", price: 49, category: "แฮมเบอร์เกอร์โฮมเมด", image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=500&q=80" }, 
      { id: 8, name: "ตอติญาโรล เนื้อ", price: 69, category: "ตอติญาโรล", image: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=500&q=80" }, 
      { id: 9, name: "ตอติญาโรล หมู", price: 69, category: "ตอติญาโรล", image: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=500&q=80" }, 
      { id: 10, name: "ตอติญาโรล ไก่กรอบ", price: 69, category: "ตอติญาโรล", image: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=500&q=80" }, 
      { id: 11, name: "เพิ่มเนื้อ", price: 25, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1588168333986-5078d3ae3976?auto=format&fit=crop&w=500&q=80" }, 
      { id: 12, name: "ชีสแผ่น", price: 10, category: "เพิ่มพิเศษ", image: "https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?auto=format&fit=crop&w=500&q=80" }
    ];

    function RestaurantApp() {
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [menu, setMenu] = useState(INITIAL_MENU);
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState("ทั้งหมด");
      const [tableNo, setTableNo] = useState("1");
      const [orderStatus, setOrderStatus] = useState(null);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const table = urlParams.get('table');
        if (table) setTableNo(table);
      }, []);

      const addToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...item, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const filteredMenu = selectedCategory === "ทั้งหมด" 
        ? menu 
        : menu.filter(item => item.category === selectedCategory);

      const handleSendOrder = () => {
        if (cart.length === 0) return;
        setOrderStatus({
          id: Math.floor(1000 + Math.random() * 9000),
          table: tableNo,
          items: cart,
          total: totalPrice,
          status: 'pending'
        });
        setCart([]);
      };

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-24">
          <header className="bg-amber-500 text-white p-4 sticky top-0 z-10 shadow-md">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold flex items-center gap-2">
                  <Utensils /> ร้านอาหารอร่อย
                </h1>
                <p className="text-xs text-amber-100">โต๊ะที่ {tableNo}</p>
              </div>
              <div className="relative">
                <ShoppingBag />
                {cart.length > 0 && (
                  <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">
                    {cart.reduce((a, b) => a + b.qty, 0)}
                  </span>
                )}
              </div>
            </div>
          </header>

          {/* Categories */}
          <div className="flex gap-2 overflow-x-auto p-4 scrollbar-none bg-slate-50">
            <button
              onClick={() => setSelectedCategory("ทั้งหมด")}
              className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${
                selectedCategory === "ทั้งหมด" ? "bg-amber-500 text-white" : "bg-white text-slate-600 border"
              }`}
            >
              ทั้งหมด
            </button>
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setSelectedCategory(cat)}
                className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${
                  selectedCategory === cat ? "bg-amber-500 text-white" : "bg-white text-slate-600 border"
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Menu Grid */}
          <div className="p-4 grid grid-cols-2 gap-4">
            {filteredMenu.map(item => (
              <div key={item.id} className="border rounded-xl overflow-hidden shadow-sm flex flex-col justify-between">
                <img src={item.image} alt={item.name} className="h-32 w-full object-cover" />
                <div className="p-3 flex-1 flex flex-col justify-between">
                  <div>
                    <h3 className="font-bold text-slate-800 text-sm">{item.name}</h3>
                    <p className="text-amber-600 font-bold text-sm mt-1">฿{item.price}</p>
                  </div>
                  <button
                    onClick={() => addToCart(item)}
                    className="mt-3 w-full bg-amber-500 hover:bg-amber-600 text-white py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1"
                  >
                    <Plus /> เพิ่มลงตะกร้า
                  </button>
                </div>
              </div>
            ))}
          </div>

          {/* Cart Drawer Bottom */}
          {cart.length > 0 && (
            <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-4 shadow-2xl z-20">
              <div className="flex justify-between items-center mb-3">
                <span className="font-bold text-slate-700">รวมทั้งหมด:</span>
                <span className="text-xl font-bold text-amber-600">฿{totalPrice}</span>
              </div>
              <button
                onClick={handleSendOrder}
                className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold text-base shadow-lg transition-colors flex items-center justify-center gap-2"
              >
                <CheckCircle2 /> ยืนยันสั่งอาหาร (โต๊ะ {tableNo})
              </button>
            </div>
          )}

          {/* Order Status Modal */}
          {orderStatus && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-30">
              <div className="bg-white rounded-2xl p-6 w-full max-w-xs text-center">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
                  <CheckCircle2 />
                </div>
                <h2 className="text-xl font-bold text-slate-800">ส่งออเดอร์เรียบร้อย!</h2>
                <p className="text-slate-500 text-sm mt-1">ออเดอร์ #{orderStatus.id} - โต๊ะ {orderStatus.table}</p>
                <p className="text-amber-600 font-bold text-lg mt-3">ราคารวม ฿{orderStatus.total}</p>
                <button
                  onClick={() => setOrderStatus(null)}
                  className="mt-5 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl font-bold text-sm"
                >
                  ปิดหน้านี้
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RestaurantApp />);
  </script>
</body>
</html>
